    const BASE = [43.018236, -71.599565];

    const map = L.map('map').setView(BASE, 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 18,
    }).addTo(map);

    // Range rings (km)
    [10, 25, 50, 80].forEach(function(r) {
        L.circle(BASE, {
            radius: r * 1000,
            color: '#16213e',
            weight: 1,
            opacity: 0.3,
            fill: false,
            dashArray: '4 6',
        }).addTo(map).bindTooltip(r + ' km', {permanent: false, direction: 'right'});
    });

    function nodeColor(n) {
        if (n.is_ours) return '#e74c3c';
        if (n.dist_km < 10) return '#2ecc71';
        if (n.dist_km < 40) return '#f39c12';
        if (n.dist_km < 80) return '#e67e22';
        return '#9b59b6';
    }

    let totalNodes = NODES.length;
    let mobileCount = NODES.filter(n => n.mobile).length;
    let estCount = NODES.filter(n => n.estimated).length;
    let maxDist = Math.max(...NODES.map(n => n.dist_km));
    document.getElementById('stats').innerHTML =
        totalNodes + ' nodes &bull; ' + mobileCount + ' mobile &bull; '
        + estCount + ' estimated &bull; max ' + maxDist.toFixed(0) + ' km';

    NODES.forEach(function(n) {
        const color = n.estimated ? '#f1c40f' : nodeColor(n);
        const radius = n.is_ours ? 10 : (n.mobile ? 6 : 7);

        const marker = L.circleMarker([n.lat, n.lon], {
            radius: radius,
            fillColor: color,
            color: n.estimated ? '#e67e22' : (n.mobile ? '#3498db' : '#333'),
            weight: n.estimated ? 2.5 : (n.is_ours ? 3 : 1.5),
            fillOpacity: n.estimated ? 0.7 : (n.is_ours ? 1.0 : 0.85),
            dashArray: n.estimated ? '2 4' : (n.mobile ? '3 3' : null),
        }).addTo(map);

        let popup = '<div class="node-popup">';
        popup += '<strong>' + n.name + '</strong>';
        if (n.short) popup += ' (' + n.short + ')';
        if (n.estimated) popup += ' <b style="color:#e67e22">[estimated]</b>';
        popup += '<br><span class="detail">';
        popup += n.id + '<br>';
        popup += 'HW: ' + n.hw + '<br>';
        popup += 'Distance: ' + n.dist_km + ' km (' + n.dist_mi + ' mi)<br>';
        if (n.alt !== null) popup += 'Altitude: ' + n.alt + ' m<br>';
        if (n.estimated) {
            popup += '<br><b>Reported (raw):</b><br>';
            popup += 'Position: ' + n.raw_lat + ', ' + n.raw_lon + '<br>';
            if (n.raw_alt !== null) popup += 'Altitude: ' + n.raw_alt + ' m<br>';
            popup += 'Raw distance: ' + n.raw_dist_km + ' km<br>';
        }
        popup += 'Position: ' + n.pos_time + '<br>';
        popup += 'Last seen: ' + n.last_seen + '<br>';
        popup += 'Packets: ' + n.packets;
        if (n.mobile) popup += ' &bull; <b style="color:#3498db">Mobile</b>';
        popup += '</span></div>';

        marker.bindPopup(popup);

        if (n.is_ours) {
            marker.bindTooltip(n.name, {permanent: true, direction: 'right', offset: [10, 0]});
        }
    });

    // Fit bounds to show all nodes with some padding
    if (NODES.length > 0) {
        const bounds = L.latLngBounds(NODES.map(n => [n.lat, n.lon]));
        bounds.extend(BASE);
        map.fitBounds(bounds, {padding: [40, 40]});
    }
